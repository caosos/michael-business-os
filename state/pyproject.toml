[project]
name = "mbos-state"
version = "0.1.0"
description = "MBOS state spine: Postgres DDL, receipted write API, hash-chain verification (Agent 04, lane D)"
requires-python = ">=3.10"   # ADR-0008 targets 3.12+; the EliteDesk currently ships 3.10, code is 3.10-compatible
dependencies = ["psycopg[binary]>=3.1"]

[project.optional-dependencies]
test = ["pytest>=8", "jsonschema>=4.18", "pgserver>=0.1"]   # pgserver: PostgreSQL 16 binaries without root

[tool.setuptools]
packages = ["mbos_state"]
