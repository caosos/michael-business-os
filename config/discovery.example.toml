# Discovery config — wave one. Only ALLOWED (tier 1/2) sources run.
# `enabled_sources` is the explicit per-source switch for PENDING_MICHAEL sources
# (MICHAEL_DECISIONS #3). Leave empty until Michael decides P2. FORBIDDEN sources
# (Facebook, Nextdoor, ...) cannot be enabled here or anywhere.
enabled_sources = []

[[profile]]
id = "flip-core-100mi"
source = "ebay"
lane = "flip"
keywords = ["utility trailer", "zero turn mower", "generator", "welder", "air compressor"]
postal_code = "72034"     # Conway, AR
radius_miles = 100        # normal radius, not a hard limit
max_price = 5000
limit = 50
max_pages = 2

# Credential-free / free-key official APIs (B-03). `live = true` is the explicit per-profile switch for
# real calls; without it the adapter refuses (fail safe). --fixtures always runs offline.
[[profile]]
id = "flip-gsa-surplus"
source = "gsa_auctions"
lane = "flip"
live = false              # needs GSA_API_KEY (free, api.data.gov)
states = ["AR", "MO", "TN", "MS", "LA", "TX", "OK"]

[[profile]]
id = "flip-free-items"
source = "trashnothing"
lane = "flip"
live = false              # needs TRASHNOTHING_API_KEY; see adapter note on gift-group reselling norms
radius_miles = 50
limit = 100
max_pages = 2

[[profile]]
id = "service-gov-contracts"
source = "samgov"
lane = "service"
live = false              # needs SAMGOV_API_KEY (free SAM.gov account key)
states = ["AR"]

[[profile]]
id = "service-website-form"
source = "website_lead"
lane = "service"
inbox = "var/intake/website_form"   # relative to the working directory

[[profile]]
id = "service-referrals"
source = "referral"
lane = "service"
inbox = "var/intake/referral"
