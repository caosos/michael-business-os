name: Deploy DealSniffer to EliteDesk

on:
  push:
    branches:
      - research/agent-06-communications
    paths:
      - deploy/dealsniffer-elitedesk-release.json

permissions:
  contents: read

concurrency:
  group: dealsniffer-elitedesk-release
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, elitedesk, dealsniffer]
    timeout-minutes: 30
    steps:
      - name: Release exact revisions on the EliteDesk
        shell: bash
        env:
          COORDINATOR: /home/michaelos/business-os-worktrees/agent-01-coordinator
        run: |
          set -euo pipefail
          cd "$COORDINATOR"
          git fetch -q origin research/agent-01-coordinator research/agent-06-communications research/agent-02-opportunity
          MANIFEST="$(git show "${GITHUB_SHA}:deploy/dealsniffer-elitedesk-release.json")"
          LANE06="$(printf '%s' "$MANIFEST" | .venv/bin/python -c 'import json,sys; print(json.load(sys.stdin)["lane06_sha"])')"
          LANE02="$(printf '%s' "$MANIFEST" | .venv/bin/python -c 'import json,sys; print(json.load(sys.stdin)["lane02_sha"])')"
          [[ "$LANE06" =~ ^[0-9a-f]{40}$ ]]
          [[ "$LANE02" =~ ^[0-9a-f]{40}$ ]]
          PROOF_DIR="$RUNNER_TEMP/dealsniffer-proof"
          mkdir -p "$PROOF_DIR"
          if ! tools/release_marketplace.sh "$LANE06" "$LANE02"; then
            tail -n 240 var/ui.log 2>/dev/null | tee "$PROOF_DIR/release-error.log" || true
            exit 1
          fi

          tools/reload_ui.sh --verify-only 8766 | tee "$PROOF_DIR/verify.txt"
          set +u
          set -a
          . var/dev.env
          . var/owner.env
          set +a
          set -u
          PREFS="$(PYTHONPATH="var/lanes/agent-06${PYTHONPATH:+:$PYTHONPATH}" .venv/bin/python -c 'from operator_ui import market_prefs; print(market_prefs.path())')"
          FACEBOOK_CACHE="$(PYTHONPATH="var/lanes/agent-06${PYTHONPATH:+:$PYTHONPATH}" .venv/bin/python -c 'from operator_ui import market_facebook; print(market_facebook.cache_path())')"
          # Attempt 4's provider check used the coordinator-relative fallback
          # instead of the module's actual preference path. Restore the exact
          # pre-test owner file captured by that release before proving again.
          PRE_TEST_PREFS="var/lanes/agent-06.prev-20261013T033042Z/var/market_prefs.json"
          if [ -f "$PRE_TEST_PREFS" ]; then cp "$PRE_TEST_PREFS" "$PREFS"; fi
          curl -fsS --max-time 30 http://127.0.0.1:8766/market > "$PROOF_DIR/market.html"
          grep -q "DealSniffer Marketplace" "$PROOF_DIR/market.html"
          grep -q "class='mk-grid' id='result-grid'" "$PROOF_DIR/market.html"
          grep -q "class='mk-save'" "$PROOF_DIR/market.html"
          grep -q "id='product-header'" "$PROOF_DIR/market.html"
          grep -q "Facebook Marketplace" "$PROOF_DIR/market.html"
          ! grep -q "id='admin-menu'" "$PROOF_DIR/market.html"
          ! grep -q "DRY-RUN · nothing leaves this machine" "$PROOF_DIR/market.html"
          ! grep -q "<header><b>Operator UI</b>" "$PROOF_DIR/market.html"
          ! grep -q "Weekly mission" "$PROOF_DIR/market.html"
          ! grep -q "HOLD backlog" "$PROOF_DIR/market.html"
          ! grep -q "Receipt ledger" "$PROOF_DIR/market.html"
          ! grep -q "id='unchecked-section'" "$PROOF_DIR/market.html"
          ! grep -q "id='working-capital'" "$PROOF_DIR/market.html"
          ! grep -q "id='gsa-explainer'" "$PROOF_DIR/market.html"
          ! grep -q "No photo" "$PROOF_DIR/market.html"

          # These are read-only customer journeys. They prove the deployed
          # account/delivery state and selling guardrails without saving a
          # preference, sending mail, creating an intake, or contacting anyone.
          curl -fsS --max-time 30 http://127.0.0.1:8766/settings > "$PROOF_DIR/settings.html"
          grep -q "id='product-header'" "$PROOF_DIR/settings.html"
          grep -q "id='deal-preferences'" "$PROOF_DIR/settings.html"
          grep -q "Google sign-in: <b>NOT CONFIGURED" "$PROOF_DIR/settings.html"
          grep -q "Email notifications: <b>NOT ACTIVE</b>" "$PROOF_DIR/settings.html"
          grep -q "id='source-onboarding'" "$PROOF_DIR/settings.html"
          grep -q "DealSniffer never asks for a source password" "$PROOF_DIR/settings.html"
          grep -q "GovDeals" "$PROOF_DIR/settings.html"
          grep -q "Public Surplus" "$PROOF_DIR/settings.html"
          ! grep -q "id='admin-menu'" "$PROOF_DIR/settings.html"
          ! grep -q "DRY-RUN · nothing leaves this machine" "$PROOF_DIR/settings.html"
          ! grep -q "<header><b>Operator UI</b>" "$PROOF_DIR/settings.html"

          curl -fsS --max-time 30 http://127.0.0.1:8766/sell > "$PROOF_DIR/sell.html"
          grep -q "id='product-header'" "$PROOF_DIR/sell.html"
          grep -q "Review only" "$PROOF_DIR/sell.html"
          grep -q "Send for human review" "$PROOF_DIR/sell.html"
          ! grep -q "id='admin-menu'" "$PROOF_DIR/sell.html"
          ! grep -q "DRY-RUN · nothing leaves this machine" "$PROOF_DIR/sell.html"
          ! grep -q "<header><b>Operator UI</b>" "$PROOF_DIR/sell.html"

          curl -fsS --max-time 30 http://127.0.0.1:8766/home > "$PROOF_DIR/home.html"
          grep -q "Find resale inventory in one place" "$PROOF_DIR/home.html"
          grep -q "Privacy" "$PROOF_DIR/home.html"
          grep -q "Terms" "$PROOF_DIR/home.html"
          curl -fsS --max-time 30 http://127.0.0.1:8766/privacy > "$PROOF_DIR/privacy.html"
          grep -q "Privacy Policy" "$PROOF_DIR/privacy.html"
          curl -fsS --max-time 30 http://127.0.0.1:8766/terms > "$PROOF_DIR/terms.html"
          grep -q "Terms of Service" "$PROOF_DIR/terms.html"
          AUTH_STATUS="$(curl -sS -o "$PROOF_DIR/auth-google.html" -w '%{http_code}' --max-time 30 http://127.0.0.1:8766/auth/google/start)"
          [ "$AUTH_STATUS" = 503 ]
          grep -q "Google sign-in is not configured yet" "$PROOF_DIR/auth-google.html"

          curl -fsS --max-time 30 http://127.0.0.1:8766/market/bids > "$PROOF_DIR/bids.html"
          grep -q "My Bids" "$PROOF_DIR/bids.html"
          grep -q "Add a bid to watch" "$PROOF_DIR/bids.html"
          grep -q "DealSniffer never asks for or signs in to a source account" "$PROOF_DIR/bids.html"
          curl -fsS --max-time 30 http://127.0.0.1:8766/sell/submissions > "$PROOF_DIR/submissions.html"
          grep -q "My submissions" "$PROOF_DIR/submissions.html"
          grep -q "^sha=$LANE06$" var/lanes/agent-06/ARTIFACT
          cp var/lanes/agent-06/ARTIFACT "$PROOF_DIR/ARTIFACT"

          # Exercise the real Facebook path once after release. Keep Michael's
          # remembered filters byte-for-byte unchanged and print configuration
          # state only; the Bright Data key itself must never enter the log.
          PREFS_COPY="$PROOF_DIR/market-prefs.before"
          PREFS_EXISTED=0
          if [ -f "$PREFS" ]; then
            cp "$PREFS" "$PREFS_COPY"
            PREFS_EXISTED=1
          fi
          restore_prefs() {
            if [ "$PREFS_EXISTED" = 1 ]; then cp "$PREFS_COPY" "$PREFS"; else rm -f "$PREFS"; fi
          }
          trap restore_prefs EXIT
          if [ -n "${BRIGHTDATA_API_KEY:-${BRIGHTDATA_TOKEN:-}}" ] || [ -s /home/michaelos/.config/mbos/secrets/BRIGHTDATA_API_KEY ] || [ -s /home/michaelos/.config/mbos/secrets/BRIGHTDATA_TOKEN ]; then
            CREDENTIAL_CONFIGURED=true
          else
            CREDENTIAL_CONFIGURED=false
          fi
          printf 'credential_configured=%s\n' "$CREDENTIAL_CONFIGURED" > "$PROOF_DIR/facebook-proof.txt"
          curl -fsS --max-time 180 'http://127.0.0.1:8766/market?go=1&keywords=trailer&base=72032&radius=30&source=facebook&cat=all' > "$PROOF_DIR/facebook-search.html"
          for ATTEMPT in 2 3 4; do
            [ -s "$FACEBOOK_CACHE" ] && break
            sleep 30
            curl -fsS --max-time 180 'http://127.0.0.1:8766/market?go=1&keywords=trailer&base=72032&radius=30&source=facebook&cat=all' > "$PROOF_DIR/facebook-search.html"
          done
          curl -fsS --max-time 30 'http://127.0.0.1:8766/market?go=1&base=72032&radius=100&source=wooley&source=blackmon&cat=tools&cat=equipment' > "$PROOF_DIR/multi-source.html"
          grep -q "name='source' value='wooley' checked" "$PROOF_DIR/multi-source.html"
          grep -q "name='source' value='blackmon' checked" "$PROOF_DIR/multi-source.html"
          grep -q "name='cat' value='tools' checked" "$PROOF_DIR/multi-source.html"
          grep -q "name='cat' value='equipment' checked" "$PROOF_DIR/multi-source.html"
          ! grep -q "name='source' value='all' checked" "$PROOF_DIR/multi-source.html"
          restore_prefs
          trap - EXIT
          set +e
          PYTHONPATH="var/lanes/agent-06${PYTHONPATH:+:$PYTHONPATH}" .venv/bin/python - <<'PY' >> "$PROOF_DIR/facebook-proof.txt"
          from datetime import datetime, timezone
          from pathlib import Path
          from operator_ui import market_facebook as fb
          if not fb.cache_path().is_file():
              d = fb.load(datetime.now(timezone.utc), keyword="trailer", city="72032", radius=30, refresh=True)
              message = " ".join(str(d.get("message") or "NONE").split())[:800]
              print(f"provider_status={d.get('status') or 'UNKNOWN'}")
              print(f"provider_message={message}")
          PY
          PROVIDER_PROBE_RC=$?
          set -e
          printf 'provider_probe_rc=%s\n' "$PROVIDER_PROBE_RC" >> "$PROOF_DIR/facebook-proof.txt"
          PYTHONPATH="var/lanes/agent-06${PYTHONPATH:+:$PYTHONPATH}" .venv/bin/python - <<'PY' >> "$PROOF_DIR/facebook-proof.txt"
          import json
          from operator_ui import market_facebook as fb
          p = fb.cache_path()
          try:
              d = json.loads(p.read_text(encoding="utf-8"))
              rows = d.get("records") if isinstance(d, dict) else None
              rows = rows if isinstance(rows, list) else []
              print("cache_exists=true")
              print(f"cache_record_count={len(rows)}")
              print(f"cache_as_of={d.get('as_of') or 'UNKNOWN'}")
              print(f"cache_query={json.dumps(d.get('query'), sort_keys=True)}")
              print(f"facebook_url_count={sum(isinstance(r, dict) and str(r.get('url', '')).startswith('https://www.facebook.com/') for r in rows)}")
              print(f"photo_count={sum(isinstance(r, dict) and bool(r.get('images') or r.get('image') or r.get('image_url')) for r in rows)}")
          except (OSError, ValueError):
              print("cache_exists=false")
              print("cache_record_count=0")
              print("cache_as_of=UNKNOWN")
              print("facebook_url_count=0")
              print("photo_count=0")
          PY

          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$CHROME" ]; then
            "$CHROME" --headless --disable-gpu --no-sandbox --window-size=1440,900 --screenshot="$PROOF_DIR/desktop.png" http://127.0.0.1:8766/market || true
            "$CHROME" --headless --disable-gpu --no-sandbox --window-size=390,844 --screenshot="$PROOF_DIR/mobile.png" http://127.0.0.1:8766/market || true
            "$CHROME" --headless --disable-gpu --no-sandbox --window-size=1440,900 --screenshot="$PROOF_DIR/settings-desktop.png" http://127.0.0.1:8766/settings || true
            "$CHROME" --headless --disable-gpu --no-sandbox --window-size=390,844 --screenshot="$PROOF_DIR/bids-mobile.png" http://127.0.0.1:8766/market/bids || true
          fi
          {
            date --iso-8601=seconds
            printf 'lane06=%s\nlane02=%s\n' "$LANE06" "$LANE02"
            ss -ltnp | grep ':8766'
            curl -fsS -o /dev/null -w 'http_status=%{http_code}\\n' --max-time 10 http://127.0.0.1:8766/market
            printf 'chrome=%s\n' "${CHROME:-NOT_FOUND}"
            cat "$PROOF_DIR/facebook-proof.txt"
          } > "$PROOF_DIR/host-proof.txt"

      - name: Upload EliteDesk proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dealsniffer-elitedesk-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/dealsniffer-proof
          if-no-files-found: error
          retention-days: 14
