name: Deploy DealSniffer to EliteDesk

on:
  push:
    branches:
      - research/agent-06-communications
    paths:
      - deploy/dealsniffer-elitedesk-release.json

permissions:
  contents: read

concurrency:
  group: dealsniffer-elitedesk-release
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, elitedesk, dealsniffer]
    timeout-minutes: 30
    steps:
      - name: Release exact revisions on the EliteDesk
        shell: bash
        env:
          COORDINATOR: /home/michaelos/business-os-worktrees/agent-01-coordinator
        run: |
          set -euo pipefail
          cd "$COORDINATOR"
          git fetch -q origin research/agent-01-coordinator research/agent-06-communications research/agent-02-opportunity
          MANIFEST="$(git show "${GITHUB_SHA}:deploy/dealsniffer-elitedesk-release.json")"
          LANE06="$(printf '%s' "$MANIFEST" | .venv/bin/python -c 'import json,sys; print(json.load(sys.stdin)["lane06_sha"])')"
          LANE02="$(printf '%s' "$MANIFEST" | .venv/bin/python -c 'import json,sys; print(json.load(sys.stdin)["lane02_sha"])')"
          REFRESH_MARKETPLACE="$(printf '%s' "$MANIFEST" | .venv/bin/python -c 'import json,sys; print(str(json.load(sys.stdin).get("refresh_marketplace", False)).lower())')"
          BID_SEED_URL="$(printf '%s' "$MANIFEST" | .venv/bin/python -c 'import json,sys; print((json.load(sys.stdin).get("owner_bid_watch_seed") or {}).get("url", ""))')"
          BID_SEED_CLOSE="$(printf '%s' "$MANIFEST" | .venv/bin/python -c 'import json,sys; print((json.load(sys.stdin).get("owner_bid_watch_seed") or {}).get("closes_at", ""))')"
          BID_SEED_CURRENT="$(printf '%s' "$MANIFEST" | .venv/bin/python -c 'import json,sys; print((json.load(sys.stdin).get("owner_bid_watch_seed") or {}).get("current_bid", ""))')"
          BID_SEED_STATUS="$(printf '%s' "$MANIFEST" | .venv/bin/python -c 'import json,sys; print((json.load(sys.stdin).get("owner_bid_watch_seed") or {}).get("status", "watching"))')"
          [[ "$LANE06" =~ ^[0-9a-f]{40}$ ]]
          [[ "$LANE02" =~ ^[0-9a-f]{40}$ ]]
          PROOF_DIR="$RUNNER_TEMP/dealsniffer-proof"
          mkdir -p "$PROOF_DIR"
          if ! tools/release_marketplace.sh "$LANE06" "$LANE02"; then
            tail -n 240 var/ui.log 2>/dev/null | tee "$PROOF_DIR/release-error.log" || true
            exit 1
          fi

          tools/reload_ui.sh --verify-only 8766 | tee "$PROOF_DIR/verify.txt"
          set +u
          set -a
          . var/dev.env
          . var/owner.env
          set +a
          set -u
          # The Marketplace page never performs a hidden GSA network request.
          # A release explicitly refreshes the official read-only cache once
          # (or reuses it when it is under an hour old), and fails visibly if
          # the source cannot produce a valid current cache.
          if [ "$REFRESH_MARKETPLACE" = true ]; then
            PYTHONPATH="var/lanes/agent-06${PYTHONPATH:+:$PYTHONPATH}" .venv/bin/python - "$PROOF_DIR/gsa-refresh.txt" <<'PY'
          import os, sys
          from mbos_discovery.adapter import SearchProfile
          from mbos_discovery.gsa_live import GsaLiveAdapter

          cache = os.environ.get("MBOS_GSA_CACHE") or "/home/michaelos/business-os-worktrees/agent-01-coordinator/var/cache/gsa-active-auctions.json"
          adapter = GsaLiveAdapter(cache, live=True, api_key=os.environ.get("GSA_API_KEY") or "DEMO_KEY")
          result = adapter.fetch(SearchProfile("market", "flip"))
          with open(sys.argv[1], "w", encoding="utf-8") as fh:
              fh.write(f"cache={cache}\n")
              fh.write(f"requests_made={result.requests_made}\n")
              fh.write(f"records_in_nearby_states={len(result.records)}\n")
              fh.write(f"as_of={adapter.summary.get('as_of') or 'UNKNOWN'}\n")
              fh.write(f"lots_in_file={adapter.summary.get('lots_in_file', 0)}\n")
              fh.write(f"error={result.error.message if result.error else 'NONE'}\n")
          if result.error:
              raise SystemExit(f"GSA refresh failed: {result.error.message}")
          PY
          fi
          PREFS="$(PYTHONPATH="var/lanes/agent-06${PYTHONPATH:+:$PYTHONPATH}" .venv/bin/python -c 'from operator_ui import market_prefs; print(market_prefs.path())')"
          FACEBOOK_CACHE="$(PYTHONPATH="var/lanes/agent-06${PYTHONPATH:+:$PYTHONPATH}" .venv/bin/python -c 'from operator_ui import market_facebook; print(market_facebook.cache_path())')"
          # Attempt 4's provider check used the coordinator-relative fallback
          # instead of the module's actual preference path. Restore the exact
          # pre-test owner file captured by that release before proving again.
          PRE_TEST_PREFS="var/lanes/agent-06.prev-20261013T033042Z/var/market_prefs.json"
          if [ -f "$PRE_TEST_PREFS" ]; then cp "$PRE_TEST_PREFS" "$PREFS"; fi
          # Every /market proof request is capable of updating remembered
          # filters. Snapshot the real owner file before the FIRST request and
          # restore it on success or failure so test queries never become
          # Michael's next screen.
          PREFS_COPY="$PROOF_DIR/market-prefs.before"
          PREFS_EXISTED=0
          if [ -f "$PREFS" ]; then
            cp "$PREFS" "$PREFS_COPY"
            PREFS_EXISTED=1
          fi
          restore_prefs() {
            if [ "$PREFS_EXISTED" = 1 ]; then cp "$PREFS_COPY" "$PREFS"; else rm -f "$PREFS"; fi
          }
          trap restore_prefs EXIT
          curl -fsS --max-time 30 http://127.0.0.1:8766/market > "$PROOF_DIR/market.html"
          grep -q "DealSniffer Marketplace" "$PROOF_DIR/market.html"
          grep -q "class='mk-grid' id='result-grid'" "$PROOF_DIR/market.html"
          grep -q "class='mk-save'" "$PROOF_DIR/market.html"
          grep -q "id='product-header'" "$PROOF_DIR/market.html"
          grep -q "Facebook Marketplace" "$PROOF_DIR/market.html"
          ! grep -q "id='admin-menu'" "$PROOF_DIR/market.html"
          ! grep -q "DRY-RUN · nothing leaves this machine" "$PROOF_DIR/market.html"
          ! grep -q "<header><b>Operator UI</b>" "$PROOF_DIR/market.html"
          ! grep -q "Weekly mission" "$PROOF_DIR/market.html"
          ! grep -q "HOLD backlog" "$PROOF_DIR/market.html"
          ! grep -q "Receipt ledger" "$PROOF_DIR/market.html"
          ! grep -q "id='unchecked-section'" "$PROOF_DIR/market.html"
          ! grep -q "id='working-capital'" "$PROOF_DIR/market.html"
          ! grep -q "id='gsa-explainer'" "$PROOF_DIR/market.html"
          ! grep -q "No photo" "$PROOF_DIR/market.html"
          PYTHONPATH="var/lanes/agent-06${PYTHONPATH:+:$PYTHONPATH}" .venv/bin/python - "$PROOF_DIR/market.html" <<'PY'
          import re, sys
          text = open(sys.argv[1], encoding="utf-8").read()
          match = re.search(r"id='result-count' class='mk-count'>([0-9,]+) results? found", text)
          if not match:
              raise SystemExit("Marketplace result count is missing")
          total = int(match.group(1).replace(",", ""))
          cards = re.findall(r"class='mk-g mk-card' data-lot='([^']+)'", text)
          if len(cards) != min(total, 50) or len(cards) != len(set(cards)):
              raise SystemExit(f"Marketplace DOM mismatch: total={total}, rendered={len(cards)}, unique={len(set(cards))}")
          if total and not all(marker in text for marker in ("id='pager-top'", "id='pager-bottom'", "Page 1 of")):
              raise SystemExit("Marketplace top/bottom page controls are missing")
          print(f"market_total={total}\nmarket_rendered={len(cards)}\nmarket_dom_integrity=true")
          PY

          # Prove the large search bar's server path does not leave the old
          # lineup visible when the query has no match.  No `go=1` here: this
          # checks filtering without starting another paid provider job.
          curl -fsS --max-time 30 'http://127.0.0.1:8766/market?keywords=zzzz-no-listing-can-match&base=72032&radius=30&source=all&cat=all' > "$PROOF_DIR/search-zero.html"
          grep -q "value='zzzz-no-listing-can-match'" "$PROOF_DIR/search-zero.html"
          grep -q "id='result-count' class='mk-count'>0 results found" "$PROOF_DIR/search-zero.html"
          grep -q "id='zero-results'" "$PROOF_DIR/search-zero.html"

          # These are read-only customer journeys. They prove the deployed
          # account/delivery state and selling guardrails without saving a
          # preference, sending mail, creating an intake, or contacting anyone.
          curl -fsS --max-time 30 http://127.0.0.1:8766/settings > "$PROOF_DIR/settings.html"
          grep -q "id='product-header'" "$PROOF_DIR/settings.html"
          grep -q "id='deal-preferences'" "$PROOF_DIR/settings.html"
          grep -q "Google sign-in: <b>NOT CONFIGURED" "$PROOF_DIR/settings.html"
          grep -q "Email notifications: <b>NOT ACTIVE</b>" "$PROOF_DIR/settings.html"
          grep -q "id='source-onboarding'" "$PROOF_DIR/settings.html"
          grep -q "DealSniffer never asks for a source password" "$PROOF_DIR/settings.html"
          grep -q "GovDeals" "$PROOF_DIR/settings.html"
          grep -q "Public Surplus" "$PROOF_DIR/settings.html"
          grep -q "Meat &amp; Groceries" "$PROOF_DIR/settings.html"
          grep -q "Fuel &amp; Automotive" "$PROOF_DIR/settings.html"
          ! grep -q "id='admin-menu'" "$PROOF_DIR/settings.html"
          ! grep -q "DRY-RUN · nothing leaves this machine" "$PROOF_DIR/settings.html"
          ! grep -q "<header><b>Operator UI</b>" "$PROOF_DIR/settings.html"

          curl -fsS --max-time 30 http://127.0.0.1:8766/sell > "$PROOF_DIR/sell.html"
          grep -q "id='product-header'" "$PROOF_DIR/sell.html"
          grep -q "Review only" "$PROOF_DIR/sell.html"
          grep -q "Send for human review" "$PROOF_DIR/sell.html"
          ! grep -q "id='admin-menu'" "$PROOF_DIR/sell.html"
          ! grep -q "DRY-RUN · nothing leaves this machine" "$PROOF_DIR/sell.html"
          ! grep -q "<header><b>Operator UI</b>" "$PROOF_DIR/sell.html"

          curl -fsS --max-time 30 http://127.0.0.1:8766/sell/deal > "$PROOF_DIR/vendor-deal.html"
          grep -q "Advertise a local deal" "$PROOF_DIR/vendor-deal.html"
          grep -q "ground beef per pound" "$PROOF_DIR/vendor-deal.html"
          grep -q "Review only" "$PROOF_DIR/vendor-deal.html"
          grep -q "Send deal for review" "$PROOF_DIR/vendor-deal.html"
          grep -q "I will keep the price, availability, and expiration current" "$PROOF_DIR/vendor-deal.html"
          ! grep -q "id='admin-menu'" "$PROOF_DIR/vendor-deal.html"

          # F-167 is deterministic first-N only. These read-only journeys prove
          # the loaded customer and vendor pages without creating or claiming a
          # deal, sending a message, taking payment, or changing owner state.
          curl -fsS --max-time 30 http://127.0.0.1:8766/market/flash > "$PROOF_DIR/flash-customer.html"
          grep -q "Flash deals" "$PROOF_DIR/flash-customer.html"
          grep -q "No random winner and no payment to claim" "$PROOF_DIR/flash-customer.html"
          curl -fsS --max-time 30 http://127.0.0.1:8766/sell/deal/flash > "$PROOF_DIR/flash-vendor.html"
          grep -q "Deterministic flash deals" "$PROOF_DIR/flash-vendor.html"
          grep -q "Fixed first-N claims only" "$PROOF_DIR/flash-vendor.html"
          grep -q "Create a scheduled flash deal" "$PROOF_DIR/flash-vendor.html"

          curl -fsS --max-time 30 http://127.0.0.1:8766/home > "$PROOF_DIR/home.html"
          grep -q "Find the deals worth leaving home for" "$PROOF_DIR/home.html"
          grep -q "Privacy" "$PROOF_DIR/home.html"
          grep -q "Terms" "$PROOF_DIR/home.html"
          curl -fsS --max-time 30 http://127.0.0.1:8766/privacy > "$PROOF_DIR/privacy.html"
          grep -q "Privacy Policy" "$PROOF_DIR/privacy.html"
          curl -fsS --max-time 30 http://127.0.0.1:8766/terms > "$PROOF_DIR/terms.html"
          grep -q "Terms of Service" "$PROOF_DIR/terms.html"
          AUTH_STATUS="$(curl -sS -o "$PROOF_DIR/auth-google.html" -w '%{http_code}' --max-time 30 http://127.0.0.1:8766/auth/google/start)"
          [ "$AUTH_STATUS" = 503 ]
          grep -q "Google sign-in is not configured yet" "$PROOF_DIR/auth-google.html"

          curl -fsS --max-time 30 http://127.0.0.1:8766/market/bids > "$PROOF_DIR/bids.html"
          grep -q "My Bids" "$PROOF_DIR/bids.html"
          grep -q "Add a bid to watch" "$PROOF_DIR/bids.html"
          grep -q "Paste a HiBid lot link" "$PROOF_DIR/bids.html"
          grep -q "Watch this auction" "$PROOF_DIR/bids.html"
          grep -q "src='/static/market_bids.js'" "$PROOF_DIR/bids.html"
          curl -fsS --max-time 30 http://127.0.0.1:8766/static/market_bids.js > "$PROOF_DIR/market_bids.js"
          grep -q "dealsniffer.bid-alert.v1" "$PROOF_DIR/market_bids.js"
          grep -q "Notification.requestPermission" "$PROOF_DIR/market_bids.js"
          curl -fsS --max-time 30 http://127.0.0.1:8766/sell/submissions > "$PROOF_DIR/submissions.html"
          grep -q "My submissions" "$PROOF_DIR/submissions.html"
          grep -q "^sha=$LANE06$" var/lanes/agent-06/ARTIFACT
          cp var/lanes/agent-06/ARTIFACT "$PROOF_DIR/ARTIFACT"

          # Exercise the real Facebook path once after release. Keep Michael's
          # remembered filters byte-for-byte unchanged and print configuration
          # state only; the Bright Data key itself must never enter the log.
          if [ -n "${BRIGHTDATA_API_KEY:-${BRIGHTDATA_TOKEN:-}}" ] || [ -s /home/michaelos/.config/mbos/secrets/BRIGHTDATA_API_KEY ] || [ -s /home/michaelos/.config/mbos/secrets/BRIGHTDATA_TOKEN ]; then
            CREDENTIAL_CONFIGURED=true
          else
            CREDENTIAL_CONFIGURED=false
          fi
          printf 'credential_configured=%s\n' "$CREDENTIAL_CONFIGURED" > "$PROOF_DIR/facebook-proof.txt"
          if [ "$REFRESH_MARKETPLACE" = true ]; then
            DENSITY_URL='http://127.0.0.1:8766/market?go=1&base=72032&radius=30&source=facebook&cat=all'
            for ATTEMPT in 1 2 3 4 5 6; do
              curl -fsS --max-time 180 "$DENSITY_URL" > "$PROOF_DIR/facebook-search.html"
              ! grep -q "id='facebook-refresh-pending'" "$PROOF_DIR/facebook-search.html" && break
              sleep 20
            done
          else
            curl -fsS --max-time 30 'http://127.0.0.1:8766/market?base=72032&radius=30&source=facebook&cat=all' > "$PROOF_DIR/facebook-search.html"
          fi
          PYTHONPATH="var/lanes/agent-06${PYTHONPATH:+:$PYTHONPATH}" .venv/bin/python - "$PROOF_DIR/facebook-search.html" <<'PY' | tee "$PROOF_DIR/facebook-render-proof.txt"
          import re, sys
          text = open(sys.argv[1], encoding="utf-8").read()
          match = re.search(r"id='result-count' class='mk-count'>([0-9,]+) results? found", text)
          total = int(match.group(1).replace(",", "")) if match else -1
          cards = re.findall(r"class='mk-g mk-card' data-lot='([^']+)'", text)
          photos = len(re.findall(r"<img[^>]+src='https://", text))
          print(f"facebook_filtered_total={total}\nfacebook_rendered={len(cards)}\nfacebook_rendered_photos={photos}")
          if total < 25:
              raise SystemExit(f"Facebook density acceptance failed: expected at least 25 filtered listings, got {total}")
          if len(cards) != min(total, 50) or len(cards) != len(set(cards)):
              raise SystemExit(f"Facebook first-page DOM mismatch: total={total}, rendered={len(cards)}, unique={len(set(cards))}")
          if not all(marker in text for marker in ("id='pager-top'", "id='pager-bottom'", "Page 1 of")):
              raise SystemExit("Facebook top/bottom pagination is missing")
          PY
          curl -fsS --max-time 30 'http://127.0.0.1:8766/market?go=1&base=72032&radius=100&source=wooley&source=blackmon&cat=tools&cat=equipment' > "$PROOF_DIR/multi-source.html"
          grep -q "name='source' value='wooley' checked" "$PROOF_DIR/multi-source.html"
          grep -q "name='source' value='blackmon' checked" "$PROOF_DIR/multi-source.html"
          grep -q "name='cat' value='tools' checked" "$PROOF_DIR/multi-source.html"
          grep -q "name='cat' value='equipment' checked" "$PROOF_DIR/multi-source.html"
          ! grep -q "name='source' value='all' checked" "$PROOF_DIR/multi-source.html"
          grep -q ".mk-cat:has(input:checked),.mk-src-row:has(input:checked)" "$PROOF_DIR/multi-source.html"
          restore_prefs
          trap - EXIT
          # Seed tonight's owner-authorized watch once. The marker prevents a
          # later deployment from resurrecting it if Michael stops tracking.
          # No source site is fetched and no bid is placed.
          if [ -n "$BID_SEED_URL" ]; then
            SEED_KEY="$(printf '%s' "$BID_SEED_URL" | sha256sum | cut -c1-20)"
            SEED_MARKER="var/deploy-seeds/bid-watch-$SEED_KEY.done"
            if [ ! -f "$SEED_MARKER" ]; then
              mkdir -p "$(dirname "$SEED_MARKER")"
              PYTHONPATH="var/lanes/agent-06${PYTHONPATH:+:$PYTHONPATH}" .venv/bin/python - "$BID_SEED_URL" "$BID_SEED_CLOSE" "$BID_SEED_CURRENT" "$BID_SEED_STATUS" <<'PY' | tee "$PROOF_DIR/bid-watch-seed.txt"
          import sys
          from datetime import datetime, timezone
          from operator_ui import market_bids

          url, closes_at, current_bid, status = sys.argv[1:]
          message = market_bids.act("add", {
              "url": url, "closes_at": closes_at, "current_bid": current_bid,
              "status": status, "next_action": "Refresh HiBid before bidding; the final-minute soft close can extend the lot.",
          }, datetime.now(timezone.utc).isoformat(timespec="seconds"))
          print(message)
          PY
              printf 'seeded_at=%s\nurl=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$BID_SEED_URL" > "$SEED_MARKER"
            else
              printf 'seed=SKIPPED_ALREADY_APPLIED\nmarker=%s\n' "$SEED_MARKER" | tee "$PROOF_DIR/bid-watch-seed.txt"
            fi
          else
            printf 'seed=NONE\n' > "$PROOF_DIR/bid-watch-seed.txt"
          fi
          set +e
          PYTHONPATH="var/lanes/agent-06${PYTHONPATH:+:$PYTHONPATH}" .venv/bin/python - <<'PY' >> "$PROOF_DIR/facebook-proof.txt"
          from datetime import datetime, timezone
          from pathlib import Path
          from operator_ui import market_facebook as fb
          if not fb.cache_path().is_file():
              d = fb.load(datetime.now(timezone.utc), keyword="trailer", city="72032", radius=30, refresh=True)
              message = " ".join(str(d.get("message") or "NONE").split())[:800]
              print(f"provider_status={d.get('status') or 'UNKNOWN'}")
              print(f"provider_message={message}")
          PY
          PROVIDER_PROBE_RC=$?
          set -e
          printf 'provider_probe_rc=%s\n' "$PROVIDER_PROBE_RC" >> "$PROOF_DIR/facebook-proof.txt"
          PYTHONPATH="var/lanes/agent-06${PYTHONPATH:+:$PYTHONPATH}" .venv/bin/python - <<'PY' >> "$PROOF_DIR/facebook-proof.txt"
          import json
          from operator_ui import market_facebook as fb
          p = fb.cache_path()
          try:
              d = json.loads(p.read_text(encoding="utf-8"))
              rows = d.get("records") if isinstance(d, dict) else None
              rows = rows if isinstance(rows, list) else []
              print("cache_exists=true")
              print(f"cache_record_count={len(rows)}")
              print(f"cache_as_of={d.get('as_of') or 'UNKNOWN'}")
              print(f"cache_query={json.dumps(d.get('query'), sort_keys=True)}")
              print(f"facebook_url_count={sum(isinstance(r, dict) and str(r.get('url', '')).startswith('https://www.facebook.com/') for r in rows)}")
              print(f"photo_count={sum(isinstance(r, dict) and bool(r.get('images') or r.get('image') or r.get('image_url')) for r in rows)}")
          except (OSError, ValueError):
              print("cache_exists=false")
              print("cache_record_count=0")
              print("cache_as_of=UNKNOWN")
              print("facebook_url_count=0")
              print("photo_count=0")
          PY

          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$CHROME" ]; then
            "$CHROME" --headless --disable-gpu --no-sandbox --window-size=1440,900 --screenshot="$PROOF_DIR/desktop.png" http://127.0.0.1:8766/market || true
            "$CHROME" --headless --disable-gpu --no-sandbox --window-size=390,844 --screenshot="$PROOF_DIR/mobile.png" http://127.0.0.1:8766/market || true
            "$CHROME" --headless --disable-gpu --no-sandbox --window-size=1440,900 --screenshot="$PROOF_DIR/settings-desktop.png" http://127.0.0.1:8766/settings || true
            "$CHROME" --headless --disable-gpu --no-sandbox --window-size=390,844 --screenshot="$PROOF_DIR/bids-mobile.png" http://127.0.0.1:8766/market/bids || true
            "$CHROME" --headless --disable-gpu --no-sandbox --window-size=1440,1000 --screenshot="$PROOF_DIR/vendor-deal-desktop.png" http://127.0.0.1:8766/sell/deal || true
            "$CHROME" --headless --disable-gpu --no-sandbox --window-size=390,1200 --screenshot="$PROOF_DIR/vendor-deal-mobile.png" http://127.0.0.1:8766/sell/deal || true
            "$CHROME" --headless --disable-gpu --no-sandbox --window-size=1440,1000 --screenshot="$PROOF_DIR/flash-customer-desktop.png" http://127.0.0.1:8766/market/flash || true
            "$CHROME" --headless --disable-gpu --no-sandbox --window-size=390,1200 --screenshot="$PROOF_DIR/flash-vendor-mobile.png" http://127.0.0.1:8766/sell/deal/flash || true
          fi
          {
            date --iso-8601=seconds
            printf 'lane06=%s\nlane02=%s\n' "$LANE06" "$LANE02"
            ss -ltnp | grep ':8766'
            curl -fsS -o /dev/null -w 'http_status=%{http_code}\\n' --max-time 10 http://127.0.0.1:8766/market
            printf 'chrome=%s\n' "${CHROME:-NOT_FOUND}"
            cat "$PROOF_DIR/facebook-proof.txt"
          } > "$PROOF_DIR/host-proof.txt"

      - name: Upload EliteDesk proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dealsniffer-elitedesk-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/dealsniffer-proof
          if-no-files-found: error
          retention-days: 14
