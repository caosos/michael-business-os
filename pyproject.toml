[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mbos-discovery"
version = "0.1.0"
description = "Michael Business OS — DISCOVER + NORMALIZE lane (Agent 02): read-only SourceAdapters producing Item v1"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.18"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mbos-discover = "mbos_discovery.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mbos_discovery = ["contracts/v1.0.0/*.json", "contracts/v1.0.0/vendor/agent-03/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
