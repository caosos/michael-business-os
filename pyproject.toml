[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mbos-governance"
version = "0.2.0"
description = "Michael Business OS governance layer: Action Gateway, PDP, execution guard, PANIC (wave one, dry-run only)"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.18", "psycopg[binary]>=3.1"]

[project.optional-dependencies]
spine = ["sqlalchemy>=2.0"]   # E-10 spine_adapter (runs inside Agent 01's mbos app)
test = ["pytest>=8", "pgserver>=0.1", "sqlalchemy>=2.0", "dbos>=3.2,<4"]   # pgserver: PostgreSQL 16 binaries for the test cluster (no root)

[project.scripts]
mbos-gov = "mbos_governance.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mbos_governance.schemas" = ["*.schema.json", "PROVENANCE.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
