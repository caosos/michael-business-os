[project]
name = "mbos"
version = "0.1.0"
description = "Michael Business OS — durable spine: DISCOVER → NORMALIZE → SCORE → RECOMMEND → APPROVE → DRY-RUN ACT → RECEIPT"
requires-python = ">=3.12"
dependencies = [
    "dbos>=3.2,<4",
    "pydantic>=2.13,<3",
    "jsonschema>=4.18",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "python-ulid>=3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pgserver>=0.1.4"]

[project.scripts]
mbos = "mbos.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mbos = ["db/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow_build: builds and installs a wheel in a clean venv",
    "acceptance: unified acceptance suite A1-A10 (docs/research/agent-01-integration.md §8)",
]
