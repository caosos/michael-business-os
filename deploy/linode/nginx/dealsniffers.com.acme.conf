# DealSniffer-managed. Phase 1 (before the certificate): answers ONLY dealsniffers.com / www.dealsniffers.com on port 80, serves the
# Let's Encrypt HTTP-01 challenge from its own directory and nothing else. No other server block is touched.
server {
    listen 80;
    listen [::]:80;
    server_name dealsniffers.com www.dealsniffers.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/dealsniffer-acme; default_type text/plain; }
    location / { return 503; }
}
