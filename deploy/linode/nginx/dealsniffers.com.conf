# DealSniffer-managed. Phase 2 (after the certificate). Only dealsniffers.com / www.dealsniffers.com and never the default server, so every other
# site on this nginx keeps its own blocks. The backend listens on 127.0.0.1:8765 only.
server {
    listen 80;
    listen [::]:80;
    server_name dealsniffers.com www.dealsniffers.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/dealsniffer-acme; default_type text/plain; }
    location / { return 301 https://dealsniffers.com$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.dealsniffers.com;
    ssl_certificate     /etc/letsencrypt/live/dealsniffers.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dealsniffers.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://dealsniffers.com$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dealsniffers.com;
    ssl_certificate     /etc/letsencrypt/live/dealsniffers.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dealsniffers.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:dealsniffer_ssl:2m;
    ssl_session_timeout 1h;
    client_max_body_size 2m;
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host dealsniffers.com;            # the app accepts only this Host; never the client's raw header
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }
}
